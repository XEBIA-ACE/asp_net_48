server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: store-management-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Do not require a live DB connection at startup (health must work regardless).
        boot.allow_jdbc_metadata_access: false

app:
  database:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    max-pool-size: ${DB_MAX_POOL_SIZE:10}
  auth:
    jwk-set-uri: ${AUTH_JWK_SET_URI}
